format = """
[](fg:base-bg)\
$os\
$shell\
$username\
$sudo\
[](bg:dir-bg fg:base-bg)\
$directory\
[](bg:git-bg fg:dir-bg)\
$git_branch\
$git_status\
[](bg:aws-bg fg:git-bg)\
$aws\
[](bg:k8s-bg fg:aws-bg)\
${custom.kubernetes}\
$terraform\
$python\
[](fg:k8s-bg)
$status\
$character
"""

palette = 'blues'

[palettes.blues]
warn = '214'
base-fg = '#e0e1dd'
dim-fg = '#a0a1a7'
base-bg = '#2f2f42'
dir-bg = '#12293f'
git-bg = '#273654'
aws-bg = '#33465c'
k8s-bg = '#4f637d'


### Line 1 configs

[os]
disabled = true

[shell]
disabled = false
format = '[$indicator]($style)'
style = 'bg:base-bg fg:warn'
zsh_indicator = ''
bash_indicator = 'bash '
fish_indicator = 'fish '
nu_indicator = 'nu '

[username]
format = '[$user ]($style)'
style_user = 'bg:base-bg fg:base-fg'
style_root = 'bg:base-bg fg:warn'
show_always = true

[sudo]
disabled = false
format = '[$symbol]($style)'
style = 'bg:base-bg fg:warn'
symbol = '! '

[directory]
format = "[   $path ]($style)"
style = 'bg:dir-bg fg:base-fg'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[git_branch]
format = '[ $symbol $branch ]($style)'
style = 'bg:git-bg fg:base-fg'
symbol = '[](bg:git-bg fg:base-fg)'

[git_status]
format = '[$ahead_behind $stashed$staged$modified$renamed$deleted$untracked$conflicted$typechanged]($style)'
style = 'bg:git-bg fg:base-fg'
# $ahead_behind status
up_to_date = '[•](bg:git-bg fg:base-fg)'
ahead = '[󰶼](bg:git-bg fg:warn)'
behind = '[󰶹](bg:git-bg fg:warn)'
diverged = '[✘](bg:git-bg fg:warn)'
# other status
stashed = '[*$count ](bg:git-bg fg:base-fg)'
staged = '[s$count ](bg:git-bg fg:base-fg)'
modified = '[m$count ](bg:git-bg fg:warn)'
renamed = '[r$count ](bg:git-bg fg:warn)'
deleted = '[d$count ](bg:git-bg fg:warn)'
untracked = '[u$count ](bg:git-bg fg:warn)'
conflicted = '[=$count ](bg:git-bg fg:warn)'
typechanged = '[t$count ](bg:git-bg fg:warn)'

[aws]
format = '[$symbol($profile)(/$region) ]($style)([$duration ](bg:aws-bg fg:dim-fg))'
style = 'bg:aws-bg fg:base-fg'
symbol = '[   ](bg:aws-bg fg:base-fg)'
expiration_symbol = 'creds expired'
force_display = false
[aws.profile_aliases]
fusionauth-dev = 'dev'
fusionauth-dev-admin = 'dev-admin'
fusionauth-prod = 'prod'
fusionauth-prod-admin = 'prod-admin'
fusionauth-svc-admin = 'svc-admin'
[aws.region_aliases]
af-south-1 = 'afs1'
ap-northeast-2 = 'apn2'
ap-southeast-1 = 'aps1'
ap-southeast-2 = 'aps2'
ca-central-1 = 'cac1'
eu-central-1 = 'euc1'
eu-north-1 = 'eun1'
eu-west-1 = 'euw1'
eu-west-2 = 'euw2'
eu-west-3 = 'euw3'
us-east-1 = 'use1'
us-east-2 = 'use2'
us-west-2 = 'usw2'

[kubernetes]
disabled = true

[custom.kubernetes]
when = 'test -r "${KUBECONFIG:-$HOME/.kube/config}"'
command = 'bash /Volumes/git/personal/dotfiles/conf/starship/kubeconfig-parse.sh'
format = '$output'
shell = ['bash']
unsafe_no_escape = true

[terraform]
format = '[$symbol$workspace ]($style)'
style = 'bg:k8s-bg fg:base-fg'
symbol = ' 󱁢 '

[python]
format = '[ ${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = 'bg:k8s-bg fg:base-fg'
symbol = ' '

### Line 2 configs

[status]
disabled = false
format = '[$status]($style) '
style = 'warn'

[character]
error_symbol = '[»](warn)'
success_symbol = '[»](base-fg)'
